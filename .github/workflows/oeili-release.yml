name: oeili-release

# wgtunnel-oeili fork — produces signed APKs for unattended phone fleets.
# Triggered on push to oeili-main or manual dispatch. Uses the standard
# Android debug keystore (good enough for internal sideload via adb, since
# these APKs never go to Play Store).

permissions:
  contents: write

on:
  push:
    branches:
      - oeili-main
      - gotatun-rust-dataplane
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Build Rust dataplane (PRD DivMode/catchseo#1618) ────────────
      # Replace amneziawg-go's Go-based libam-go.so with our GotaTun
      # (Rust) implementation for ~3× single-stream throughput on phone.
      # The .so we produce is dropped into app/src/main/jniLibs/ so it
      # wins over the one bundled in the amneziawg-android Maven AAR.
      - name: Set up Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/gotatun/target
          key: gotatun-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Clone DivMode/gotatun fork (Rust dataplane)
        run: |
          set -euo pipefail
          rm -rf /tmp/gotatun
          git clone --branch gotatun-android-jni --depth 1 \
            https://github.com/DivMode/gotatun.git /tmp/gotatun

      - name: Build libam-go.so via cargo-ndk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # cargo-ndk also reads ANDROID_NDK_ROOT — keep it consistent with
          # ANDROID_NDK_HOME or it logs a warning and may pick the runner's
          # pre-installed NDK instead of the version we set up.
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd /tmp/gotatun
          # cargo-ndk 4.x: `-t` is target, `--platform` is the NDK API
          # level. (`-p` is forwarded to the inner `cargo` invocation —
          # passing it to cargo-ndk gives "unknown package: 24".)
          # API 24 = Android 7.0 Nougat, the minSdk wgtunnel-android targets.
          cargo ndk -t arm64-v8a --platform 24 -- build \
            -p gotatun-android-jni --release --no-default-features
          # cargo's [lib].name = "am_go" produces libam_go.so but the
          # Kotlin side calls ReLinker.loadLibrary(context, "am-go") which
          # looks for libam-go.so. Rename on copy.
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/libam_go.so \
             "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libam-go.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Verify Rust .so contains the JNI symbols Kotlin needs
        run: |
          set -euo pipefail
          SO="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libam-go.so"
          # Both GoBackend (7) and ProxyGoBackend (6) symbols must be present
          # — the JVM resolves all static native methods at class-load time,
          # not lazily, so any missing symbol crashes AbstractBackend init.
          REQUIRED='awgVersion awgTurnOn awgTurnOff awgGetSocketV4 awgGetSocketV6 awgGetConfig awgUpdateTunnelPeers awgStartProxy awgUpdateProxyTunnelPeers awgStopProxy awgGetProxyConfig awgSetSocketProtector awgResetJNIGlobals'
          MISSING=""
          for sym in $REQUIRED; do
            if ! nm -D --defined-only "$SO" 2>/dev/null | grep -q " $sym$"; then
              if ! "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$SO" | grep -q " $sym$"; then
                MISSING="$MISSING $sym"
              fi
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: libam-go.so missing required JNI symbols:$MISSING" >&2
            exit 1
          fi
          echo "✓ all 13 JNI symbols present in libam-go.so"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build standalone debug APK
        run: ./gradlew :app:assembleStandaloneDebug --stacktrace

      - name: Locate APK + compute metadata
        id: locate
        run: |
          set -euo pipefail
          # WG Tunnel's standalone flavor produces three APKs:
          #   wgtunnel-standalone-vX.Y.Z.apk         (universal, all ABIs)
          #   wgtunnel-standalone-vX.Y.Z-arm64.apk   (64-bit only)
          #   wgtunnel-standalone-vX.Y.Z-armv7.apk   (32-bit only)
          # Prefer the universal one — fits Pixel 7 (arm64), Pixel 8 (arm64),
          # Galaxy S24+/S26+ (arm64), and any 32-bit phone we'd ever add. Slight
          # size cost (~+10MB) for one-pin-fits-all simplicity. Fall back to
          # arm64 if the build ever drops the universal variant.
          APK_PATH=$(find app/build/outputs/apk/standalone/debug -name '*.apk' -type f \
            ! -name '*-arm*' ! -name '*-x86*' | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/standalone/debug -name '*-arm64*.apk' -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: no universal or arm64 APK produced" >&2
            echo "Available APKs:" >&2
            find app/build/outputs/apk/standalone/debug -name '*.apk' -type f >&2 || true
            exit 1
          fi
          echo "Using APK: $APK_PATH" >&2
          cp "$APK_PATH" wgtunnel-oeili.apk
          APK_SHA256=$(sha256sum wgtunnel-oeili.apk | cut -d' ' -f1)
          DATE_PART=$(date -u +%Y.%m.%d)
          SHORT_SHA=${GITHUB_SHA:0:8}
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "version=${DATE_PART}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=oeili-v${DATE_PART}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Tag + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.locate.outputs.tag }}
          APK_SHA256: ${{ steps.locate.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --title "oeili $RELEASE_TAG" \
            --notes "Auto-built debug-signed APK." \
            --notes "" \
            --notes "SHA256: \`${APK_SHA256}\`" \
            --target "$GITHUB_SHA" \
            wgtunnel-oeili.apk

      - name: Update latest pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SHA256: ${{ steps.locate.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          # Re-create the 'oeili-latest' release so the latest-download URL
          # always points at the most recent build. Ansible consumes:
          #   https://github.com/DivMode/wgtunnel-android/releases/download/oeili-latest/wgtunnel-oeili.apk
          gh release delete oeili-latest --yes --cleanup-tag || true
          SHORT_SHA=${GITHUB_SHA:0:8}
          gh release create oeili-latest \
            --title "Latest oeili build" \
            --notes "Auto-updated pointer to the most recent build." \
            --notes "Source SHA: \`${SHORT_SHA}\`" \
            --notes "APK SHA256: \`${APK_SHA256}\`" \
            --target "$GITHUB_SHA" \
            wgtunnel-oeili.apk
